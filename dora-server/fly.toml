# fly.toml app configuration file generated for dora-server on 2026-04-21T13:49:11+06:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dora-server'
primary_region = 'sin'

[build]
  # Private Wash UI package: pass GitHub Packages token at build time, e.g.
  #   fly deploy --build-arg NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN
  # or a Fly Docker build secret named NODE_AUTH_TOKEN (see Dockerfile ARG).

[env]
  NODE_OPTIONS = '--max-old-space-size=768'

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
