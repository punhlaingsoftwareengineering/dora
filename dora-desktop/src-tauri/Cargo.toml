[package]
name = "app"
version = "1.0.0"
description = "Dora"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
directories = "6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["macos-proxy"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
whoami = "1.6.1"
rfd = "0.15"

# Platform webview handles for site-window permission auto-allow (see site_permissions.rs).
# Versions match tauri/wry lockfile; do not cargo-add newer crates offline.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
